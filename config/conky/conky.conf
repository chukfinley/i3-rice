conky.config = {
    own_window = true,
    own_window_type = 'override',
    own_window_class = 'Conky',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 120,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    alignment = 'top_right',
    gap_x = 15,
    gap_y = 40,
    
    minimum_width = 250,
    maximum_width = 250,
    minimum_height = 500,
    
    background = true,
    border_width = 0,
    default_color = '#D8DEE9',
    
    color1 = '#88C0D0',
    color2 = '#81A1C1',
    color3 = '#5E81AC',
    color4 = '#A3BE8C',
    color5 = '#EBCB8B',
    color6 = '#D08770',
    color7 = '#BF616A',
    color8 = '#434C5E',
    
    font = 'monospace:size=9',
    update_interval = 2,
    use_xft = true,
    double_buffer = true,
};

conky.text = [[
${color1}${font :bold:size=11} SYSTEM ${color8}${hr 2}${font :size=9}

CPU:${alignr}${color4}${cpu}% @ ${freq_g}GHz
${color3}${cpugraph 35,240 81A1C1 88C0D0 -t}

RAM:${alignr}${color5}${memperc}% / ${memmax}
${color3}${memgraph 35,240 81A1C1 88C0D0 -t}

Disk/:${alignr}${color6}${fs_used_perc /}%
${color3}${fs_bar 5,240 /}

Home:${alignr}${color6}${fs_used_perc /home}%
${color3}${fs_bar 5,240 /home}

Temp:${alignr}${color1}${execi 5 sensors 2>/dev/null | grep -i 'tctl\|core 0' | head -1 | awk '{print $2}' | sed 's/+//' || echo 'N/A'}

${color1}${font :bold:size=11} SPOTIFY ${color8}${hr 2}
${if_existing /tmp/conky-spotify-cover.jpg}
${image /tmp/conky-spotify-cover.jpg -p 25,420 -s 200x200}
${else}
${image /home/user/.config/conky/default-cover.jpg -p 25,420 -s 200x200}
${endif}
${voffset 205}${font :size=9}
${if_match "${execi 2 ~/.config/conky/spotify-status.sh}" == "1"}${color0}${alignc}${execi 2 ~/.config/conky/spotify-track.sh | head -c 35}
${color2}${alignc}${execi 2 ~/.config/conky/spotify-album.sh | head -c 35}${else}${color8}${alignc}-- no music --${endif}

${color1}${font :bold:size=11} NETWORK ${color8}${hr 2}${font :size=9}
Down:${alignr}${color4}${downspeedf ${gw_iface}} MB/s
${color3}${downspeedgraph ${gw_iface} 20,240 81A1C1 88C0D0 -t}
Up:${alignr}${color6}${upspeedf ${gw_iface}} MB/s
${color3}${upspeedgraph ${gw_iface} 20,240 81A1C1 D08770 -t}

${color1}${font :bold:size=11} TIME ${color8}${hr 2}
${color0}${font :bold:size=22}${alignc}${time %H:%M}${font :size=10}
${color2}${alignc}${time %a, %d %b %Y}${font :size=9}

Uptime:${alignr}${uptime_short}
]];
